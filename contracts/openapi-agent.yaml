# =========================================================================
# COMPONENTS
# =========================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Store-issued RS256 JWT. Claims: sub (user_id), role
        (customer, seller_owner, seller_staff, service), customer_id,
        aud: [sellershield-agent, nestkart-api], auth_time.

  parameters:
    X-Request-ID:
      name: X-Request-ID
      in: header
      required: false
      description: End-to-end tracing UUID
      schema:
        type: string
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: true
      description: Client mutation idempotency key
      schema:
        type: string
    X-Store-Signature:
      name: X-Store-Signature
      in: header
      required: true
      description: HMAC-SHA256 signature of timestamp.body using WEBHOOK_SECRET
      schema:
        type: string
    X-Store-Timestamp:
      name: X-Store-Timestamp
      in: header
      required: true
      description: UTC unix timestamp in seconds when webhook was dispatched
      schema:
        type: integer
    X-Event-Id:
      name: X-Event-Id
      in: header
      required: true
      description: Outbox event UUID for deduplication
      schema:
        type: string

  responses:
    Error400:
      description: Validation error or invalid payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Unauthorized, missing token, or step-up required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            stepUpRequired:
              summary: Seller step-up authorization required
              value:
                error:
                  code: "step_up_required"
                  message: "Action requires recent authentication within 15 minutes"
                  request_id: "req-stepup-999"
                  details:
                    auth_time_required_seconds: 900
    Error403:
      description: Forbidden - insufficient permissions or role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Resource not found (uniform 404 for nonexistent or unowned items)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: State conflict, version mismatch, or limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # -----------------------------------------------------------------------
    # Error Model
    # -----------------------------------------------------------------------
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true

    ErrorCode:
      type: string
      enum:
        - not_found
        - forbidden
        - invalid_state
        - limit_exceeded
        - duplicate
        - validation_error
        - upstream_unavailable
        - idempotency_mismatch
        - step_up_required

    # -----------------------------------------------------------------------
    # Chat Models & Cards
    # -----------------------------------------------------------------------
    CreateChatSessionRequest:
      type: object
      additionalProperties: false
      properties:
        order_context_id:
          type: string

    ChatSessionResponse:
      type: object
      additionalProperties: false
      required: [session_id, customer_id, created_at, greeting_chips]
      properties:
        session_id:
          type: string
        customer_id:
          type: string
        created_at:
          type: string
          format: date-time
        greeting_chips:
          type: array
          items:
            type: string

    ChatMessageRequest:
      type: object
      additionalProperties: false
      required: [text, client_msg_id]
      properties:
        text:
          type: string
          maxLength: 1000
        client_msg_id:
          type: string
        evidence_ids:
          type: array
          maxItems: 3
          items:
            type: string

    ChatCard:
      type: object
      additionalProperties: false
      required: [card_type, payload]
      properties:
        card_type:
          type: string
          enum:
            - order_summary
            - shipment_timeline
            - return_preview
            - confirmation
            - case_created
            - chips
        payload:
          type: object
          additionalProperties: true

    ChatHistoryMessage:
      type: object
      additionalProperties: false
      required: [message_id, sender, text, created_at]
      properties:
        message_id:
          type: string
        sender:
          type: string
          enum: [customer, agent, seller]
        text:
          type: string
        cards:
          type: array
          items:
            $ref: '#/components/schemas/ChatCard'
        created_at:
          type: string
          format: date-time

    ChatHistoryResponse:
      type: object
      additionalProperties: false
      required: [session_id, messages]
      properties:
        session_id:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatHistoryMessage'

    CustomerEvent:
      type: object
      additionalProperties: false
      required: [event_id, type, payload, created_at]
      properties:
        event_id:
          type: string
        type:
          type: string
          enum:
            - approval.decided
            - case.message
            - case.status
            - notification.new
            - proposal.expired
            - monitor.notice
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    CustomerEventListResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/CustomerEvent'
        next_cursor:
          type: string
          nullable: true

    # -----------------------------------------------------------------------
    # Proposal Models
    # -----------------------------------------------------------------------
    ConfirmProposalRequest:
      type: object
      additionalProperties: false
      required: [proposal_hash]
      properties:
        proposal_hash:
          type: string
          description: SHA-256 hash of the proposal ensuring deterministic agreement

    ConfirmProposalResponse:
      type: object
      additionalProperties: false
      required: [proposal_id, status, message_key]
      properties:
        proposal_id:
          type: string
        status:
          type: string
          enum:
            - executing
            - succeeded
            - pending_approval
            - unknown
            - failed
        return_id:
          type: string
          nullable: true
        approval_id:
          type: string
          nullable: true
        message_key:
          type: string

    # -----------------------------------------------------------------------
    # Case & Support Models
    # -----------------------------------------------------------------------
    RequestHumanSupportRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
        order_id:
          type: string
        evidence_ids:
          type: array
          maxItems: 3
          items:
            type: string

    CaseMessage:
      type: object
      additionalProperties: false
      required: [message_id, sender_role, sender_id, text, created_at]
      properties:
        message_id:
          type: string
        sender_role:
          type: string
          enum: [customer, seller, agent]
        sender_id:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time

    CaseBrief:
      type: object
      additionalProperties: false
      required: [case_id, customer_id, reason, facts, created_at]
      properties:
        case_id:
          type: string
        customer_id:
          type: string
        order_id:
          type: string
          nullable: true
        reason:
          type: string
        facts:
          type: object
          additionalProperties: true
        llm_summary:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    CustomerCase:
      type: object
      additionalProperties: false
      required: [case_id, customer_id, status, reason, created_at, messages]
      properties:
        case_id:
          type: string
        customer_id:
          type: string
        order_id:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, pending_customer, resolved, closed]
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/CaseMessage'

    CustomerCaseListResponse:
      type: object
      additionalProperties: false
      required: [cases]
      properties:
        cases:
          type: array
          items:
            $ref: '#/components/schemas/CustomerCase'

    SellerCase:
      type: object
      additionalProperties: false
      required: [case_id, customer_id, status, reason, priority, created_at, messages]
      properties:
        case_id:
          type: string
        customer_id:
          type: string
        order_id:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, pending_customer, resolved, closed]
        reason:
          type: string
        priority:
          type: string
          enum: [normal, urgent]
        assigned_to:
          type: string
          nullable: true
        evidence_ids:
          type: array
          items:
            type: string
        brief:
          $ref: '#/components/schemas/CaseBrief'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/CaseMessage'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SellerCaseListResponse:
      type: object
      additionalProperties: false
      required: [cases]
      properties:
        cases:
          type: array
          items:
            $ref: '#/components/schemas/SellerCase'

    SendCaseMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          maxLength: 2000

    # -----------------------------------------------------------------------
    # Seller Approvals
    # -----------------------------------------------------------------------
    SellerApproval:
      type: object
      additionalProperties: false
      required:
        - approval_id
        - proposal_id
        - customer_id
        - order_id
        - requested_amount_paise
        - reason
        - status
        - expected_version
        - created_at
      properties:
        approval_id:
          type: string
        proposal_id:
          type: string
        customer_id:
          type: string
        order_id:
          type: string
        requested_amount_paise:
          type: integer
          minimum: 0
        reason:
          type: string
        status:
          type: string
          enum: [pending, approving, approved, rejected]
        expected_version:
          type: integer
        risk_flags:
          type: array
          items:
            type: string
        store_authorization_ref:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
