openapi: 3.1.0
info:
  title: SellerShield Agent API
  version: 1.0.0
  description: >
    Official agent backend API for SellerShield AI (Document 2 specification).
    Provides customer chat sessions with server-sent events (SSE), proposal confirmation,
    seller approval cards, case escalation workflows, Decision Trace, Policy Studio,
    proactive order monitoring, and tamper-evident audit log verification.
servers:
  - url: http://localhost:8001/v1
    description: Local development agent API server

security:
  - bearerAuth: []

tags:
  - name: chat
    description: Customer chat sessions, streaming LLM dialogue, and push notifications
  - name: proposals
    description: Deterministic policy proposals, button confirmations, and execution tracking
  - name: customer_support
    description: Customer support cases, human escalation, and customer privacy controls
  - name: seller_approvals
    description: Seller approval queue, review cards, and step-up authorized decisions
  - name: seller_cases
    description: Seller support inbox, case brief inspection, assignment, and handbacks
  - name: seller_ops
    description: Operational overview, live activity SSE, Decision Trace, audit chain, and monitor
  - name: policy_studio
    description: Seller policy authoring, versioning, simulation, and owner activation
  - name: system_and_dev
    description: Store webhook ingestion, system health probes, and dev test harnesses

paths:
  # =========================================================================
  # CHAT
  # =========================================================================
  /chat/sessions:
    post:
      tags: [chat]
      summary: Create or resume a customer chat session
      operationId: create_chat_session
      x-required-role: customer
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatSessionRequest'
      responses:
        '201':
          description: Chat session created or resumed with greeting chips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'

  /chat/sessions/{id}/messages:
    post:
      tags: [chat]
      summary: Send message to chat session and stream agent response
      operationId: send_chat_message
      x-required-role: customer
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '200':
          description: SSE event stream delivering message chunks, tool status, and cards
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream
          x-sse-events:
            events:
              message.delta:
                description: Text token delta from agent
                schema:
                  type: object
                  additionalProperties: false
                  required: [delta]
                  properties:
                    delta:
                      type: string
              tool.status:
                description: Status update for agent tool execution
                schema:
                  type: object
                  additionalProperties: false
                  required: [tool_name, status]
                  properties:
                    tool_name:
                      type: string
                    status:
                      type: string
                      enum: [calling, executing, completed, failed]
              card:
                description: Interactive UI card rendered inline in chat
                schema:
                  $ref: '#/components/schemas/ChatCard'
              final:
                description: Finalized message envelope and metadata
                schema:
                  type: object
                  additionalProperties: false
                  required: [message_id, full_text]
                  properties:
                    message_id:
                      type: string
                    full_text:
                      type: string
              error:
                description: Safe user-facing error notification
                schema:
                  type: object
                  additionalProperties: false
                  required: [code, safe_message]
                  properties:
                    code:
                      type: string
                    safe_message:
                      type: string
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'

  /chat/sessions/{id}:
    get:
      tags: [chat]
      summary: Get customer-visible message history for chat session
      operationId: get_chat_session
      x-required-role: customer
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chat session history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatHistoryResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /chat/stream:
    get:
      tags: [chat]
      summary: Real-time customer push notification SSE stream
      operationId: stream_chat_push_events
      x-required-role: customer
      description: >
        Delivers push events for customer's active chat session: approval.decided,
        case.message, case.status, notification.new, proposal.expired, and monitor.notice.
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: Real-time SSE push stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error401'

  /me/events:
    get:
      tags: [chat]
      summary: Poll customer events when SSE stream is unavailable
      operationId: poll_customer_events
      x-required-role: customer
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: since
          in: query
          required: false
          schema:
            type: string
            description: Event cursor timestamp or UUID
      responses:
        '200':
          description: List of new customer-safe events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerEventListResponse'
        '401':
          $ref: '#/components/responses/Error401'

  # =========================================================================
  # PROPOSALS
  # =========================================================================
  /proposals/{id}/confirm:
    post:
      tags: [proposals]
      summary: Customer confirms proposed action via button click
      operationId: confirm_proposal
      x-required-role: customer
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmProposalRequest'
      responses:
        '200':
          description: Proposal execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmProposalResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'

  /proposals/{id}/cancel:
    post:
      tags: [proposals]
      summary: Customer cancels or declines proposed resolution
      operationId: cancel_proposal
      x-required-role: customer
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Proposal cancelled
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [proposal_id, status]
                properties:
                  proposal_id:
                    type: string
                  status:
                    type: string
                    example: "cancelled"
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'

  # =========================================================================
  # CUSTOMER SUPPORT
  # =========================================================================
  /support/request-human:
    post:
      tags: [customer_support]
      summary: Customer requests human support agent escalation
      operationId: request_human_support
      x-required-role: customer
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestHumanSupportRequest'
      responses:
        '201':
          description: Support case created for seller review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCase'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'

  /me/cases:
    get:
      tags: [customer_support]
      summary: List customer support cases
      operationId: list_customer_cases
      x-required-role: customer
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: List of support cases for the calling customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCaseListResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /me/cases/{id}:
    get:
      tags: [customer_support]
      summary: Get customer support case thread and status
      operationId: get_customer_case
      x-required-role: customer
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Case details and messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCase'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /me/cases/{id}/messages:
    post:
      tags: [customer_support]
      summary: Customer sends message in support case
      operationId: send_customer_case_message
      x-required-role: customer
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCaseMessageRequest'
      responses:
        '201':
          description: Message posted to case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseMessage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /me/memory:
    delete:
      tags: [customer_support]
      summary: Customer requests erasure of long-term personalized memory
      operationId: erase_customer_memory
      x-required-role: customer
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: Customer memory erased
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [erased]
                properties:
                  erased:
                    type: boolean
        '401':
          $ref: '#/components/responses/Error401'

  # =========================================================================
  # SELLER APPROVALS
  # =========================================================================
  /seller/approvals:
    get:
      tags: [seller_approvals]
      summary: List pending seller approvals queue
      operationId: list_seller_approvals
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approving, approved, rejected]
      responses:
        '200':
          description: List of approvals in queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerApprovalListResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /seller/approvals/{id}:
    get:
      tags: [seller_approvals]
      summary: Get approval card details and verification facts
      operationId: get_seller_approval
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approval card with order details, risk facts, and proposed amounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerApproval'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  /seller/approvals/{id}/decision:
    post:
      tags: [seller_approvals]
      summary: Seller makes approval decision (Approve or Reject)
      operationId: decide_seller_approval
      x-required-role: seller
      description: >
        Enforces seller limits (staff up to ₹2,000; owner above). Approvals above threshold
        require 15-min auth_time step-up (returns 401 step_up_required).
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: Approval decision recorded and executed against store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerApproval'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'

  # =========================================================================
  # SELLER CASES
  # =========================================================================
  /seller/cases:
    get:
      tags: [seller_cases]
      summary: List escalated cases in seller inbox
      operationId: list_seller_cases
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, pending_customer, resolved, closed]
      responses:
        '200':
          description: Case list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerCaseListResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /seller/cases/{id}:
    get:
      tags: [seller_cases]
      summary: Get full support case details
      operationId: get_seller_case
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Case record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerCase'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  /seller/cases/{id}/brief:
    get:
      tags: [seller_cases]
      summary: Get deterministic structured brief for support case
      operationId: get_seller_case_brief
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Structured case brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseBrief'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  /seller/cases/{id}/messages:
    post:
      tags: [seller_cases]
      summary: Seller sends reply in support case
      operationId: send_seller_case_message
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCaseMessageRequest'
      responses:
        '201':
          description: Seller response added to case thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseMessage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  /seller/cases/{id}/status:
    post:
      tags: [seller_cases]
      summary: Update support case status
      operationId: update_seller_case_status
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, pending_customer, resolved, closed]
                resolution_note:
                  type: string
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerCase'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  /seller/cases/{id}/assign:
    post:
      tags: [seller_cases]
      summary: Assign case to staff member
      operationId: assign_seller_case
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assigned_to]
              properties:
                assigned_to:
                  type: string
      responses:
        '200':
          description: Case assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerCase'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  /seller/cases/{id}/handback:
    post:
      tags: [seller_cases]
      summary: Hand human-handled case back to autonomous agent
      operationId: handback_seller_case
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                instructions:
                  type: string
      responses:
        '200':
          description: Case handed back to agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerCase'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  # =========================================================================
  # SELLER OPS & OBSERVABILITY
  # =========================================================================
  /seller/overview:
    get:
      tags: [seller_ops]
      summary: Get seller dashboard overview KPI tiles
      operationId: get_seller_overview
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: Overview metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOverviewResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /seller/activity:
    get:
      tags: [seller_ops]
      summary: Real-time SSE stream of seller activity
      operationId: stream_seller_activity
      x-required-role: seller
      description: Real-time stream of approvals, incoming cases, and overdue alerts.
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: SSE stream of seller activity events
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /seller/traces/{request_id}:
    get:
      tags: [seller_ops]
      summary: Get Decision Trace for a specific request ID
      operationId: get_seller_trace
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Decision Trace joining LLM calls, tool executions, and audit records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionTraceResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  /seller/audit:
    get:
      tags: [seller_ops]
      summary: Query immutable audit event log
      operationId: list_seller_audit_events
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Audit log events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /seller/audit/verify:
    get:
      tags: [seller_ops]
      summary: Verify integrity of SHA-256 audit hash chain
      operationId: verify_seller_audit_chain
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: Cryptographic hash chain verification report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /seller/notifications:
    get:
      tags: [seller_ops]
      summary: List notification outbox messages
      operationId: list_seller_notifications
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: Notification outbox list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /seller/notifications/{id}/retry:
    post:
      tags: [seller_ops]
      summary: Retry failed outbox notification delivery
      operationId: retry_seller_notification
      x-required-role: seller
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
