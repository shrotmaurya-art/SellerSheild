openapi: 3.1.0
info:
  title: NestKart Store API
  version: 1.0.0
  description: >
    Official store backend API for NestKart (Document 1 specification).
    Provides authentication, order management, shipments, evidence handling,
    returns transition engine, refunds, admin backoffice, mail threads, carrier simulation,
    and demo control center for SellerShield AI.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development store API server

security:
  - bearerAuth: []

tags:
  - name: auth
    description: User, customer and service authentication, session rotation and key discovery
  - name: orders
    description: Customer orders, shipment tracking, evidence upload and refundable lookups
  - name: returns
    description: Customer return requests, transitions, approvals, and cancellations
  - name: refunds
    description: Autonomous and seller-authorized refunds, holds, release, and customer history
  - name: admin
    description: Seller backoffice operations, inspection, cancellation, and autonomy caps
  - name: mail
    description: Simulated customer-seller mailbox threads with DKIM/verified-sender validation
  - name: sim
    description: Carrier simulation endpoints for tracking events and test playouts
  - name: demo
    description: Demo control center, simulated clock, fault injection, and scenario loading

paths:
  # =========================================================================
  # AUTH
  # =========================================================================
  /auth/register:
    post:
      tags: [auth]
      summary: Register customer account (P1)
      operationId: register_customer
      security: []
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Customer account registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'

  /auth/login:
    post:
      tags: [auth]
      summary: User login
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully, returns JWT access token and sets refresh cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      operationId: refresh_token
      security: []
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: Access token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout and revoke refresh token
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                required: [success]
        '401':
          $ref: '#/components/responses/Error401'

  /auth/me:
    get:
      tags: [auth]
      summary: Get currently authenticated user profile
      operationId: get_current_user
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: Current user profile and claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /.well-known/jwks.json:
    get:
      tags: [auth]
      summary: Get JSON Web Key Set for token signature verification
      operationId: get_jwks
      security: []
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: Public JWKS keys for verifying access tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKSResponse'

  /auth/token:
    post:
      tags: [auth]
      summary: Issue service token using client credentials
      operationId: issue_service_token
      security: []
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceTokenRequest'
      responses:
        '200':
          description: Service JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTokenResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /clock:
    get:
      tags: [auth]
      summary: Get public simulated clock time
      operationId: get_public_clock
      security: []
      description: Always-on read-only access to simulated store clock for synchronization.
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: Current simulated UTC clock time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicClockResponse'

  # =========================================================================
  # ORDERS
  # =========================================================================
  /orders:
    get:
      tags: [orders]
      summary: List customer orders
      operationId: list_orders
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of customer orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /orders/{id}:
    get:
      tags: [orders]
      summary: Get order details
      operationId: get_order
      description: Returns order by ID for the calling customer. Unowned orders yield uniform 404.
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed order record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /orders/{id}/shipment:
    get:
      tags: [orders]
      summary: Get order shipment status, tracking and timeline events
      operationId: get_order_shipment
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Shipment status and event timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderShipmentResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /orders/{id}/evidence:
    post:
      tags: [orders]
      summary: Upload photographic evidence for an order
      operationId: upload_order_evidence
      description: Upload evidence image (JPG, PNG, WebP up to 2 MB; max 3 per order).
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (max 2 MB; jpg, png, webp)
                note:
                  type: string
      responses:
        '201':
          description: Evidence image successfully uploaded and sanitized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceItem'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
    get:
      tags: [orders]
      summary: List evidence uploaded for an order
      operationId: list_order_evidence
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of evidence items for the order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceListResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /evidence/{id}:
    get:
      tags: [orders]
      summary: Retrieve evidence file metadata or content
      operationId: get_evidence
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Evidence metadata and retrieval access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceItem'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /orders/{id}/refundable:
    get:
      tags: [orders]
      summary: Check remaining refundable quantities and max amount
      operationId: get_order_refundable
      description: Returns per-item refundable eligibility, remaining quantities and max net refundable paise.
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: items
          in: query
          required: false
          description: Optional list of item quantities to evaluate in format ITEM_ID:QTY,ITEM_ID:QTY
          schema:
            type: string
      responses:
        '200':
          description: Refundable breakdown and remaining balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundableCheckResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  # =========================================================================
  # RETURNS
  # =========================================================================
  /orders/{id}/returns:
    post:
      tags: [returns]
      summary: Create return request for order items
      operationId: create_return
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReturnRequest'
            examples:
              customerReturn:
                summary: Return defective cookware item
                value:
                  items:
                    - item_id: "ITEM-101"
                      qty: 1
                      condition_note: "Handle loose on arrival"
                  reason_code: "defective"
                  reason_text: "Cookware handle loose on unboxing"
                  resolution: "refund"
      responses:
        '201':
          description: Return requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'

  /returns:
    get:
      tags: [returns]
      summary: List returns
      operationId: list_returns
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of returns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnListResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /returns/{id}:
    get:
      tags: [returns]
      summary: Get return details
      operationId: get_return
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Return record details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /returns/{id}/transition:
    post:
      tags: [returns]
      summary: Transition return state along valid lifecycle edges
      operationId: transition_return
      description: Triggered by seller or agent-executor (within autonomy cap).
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionReturnRequest'
      responses:
        '200':
          description: Return transitioned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'

  /returns/{id}/cancel:
    post:
      tags: [returns]
      summary: Cancel customer return request before approval
      operationId: cancel_return
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReturnRequest'
      responses:
        '200':
          description: Return request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'

  # =========================================================================
  # REFUNDS
  # =========================================================================
  /orders/{id}/refund-reservations:
    post:
      tags: [refunds]
      summary: Reserve atomic refund hold for an order
      operationId: create_refund_reservation
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundReservationRequest'
            examples:
              reserveCookware:
                summary: Reserve refund hold for defective item
                value:
                  amount_paise: 120000
                  return_id: "RET-1042"
                  method: "original"
      responses:
        '201':
          description: Refund reservation created in reserved status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'

  /refunds/{id}/authorize:
    post:
      tags: [refunds]
      summary: Seller authorization for refund release
      operationId: authorize_refund
      description: Records seller authorization for refunds above autonomy cap.
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRefundRequest'
            examples:
              authorizeHighValue:
                summary: Seller authorizes full refund
                value:
                  amount_paise: 120000
                  note: "Approved per photo evidence inspection"
      responses:
        '200':
          description: Refund authorized by seller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'

  /refunds/{id}/release:
    post:
      tags: [refunds]
      summary: Release reserved refund hold to gateway
      operationId: release_refund
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            examples:
              releaseExecution:
                summary: Execute refund release
                value: {}
      responses:
        '200':
          description: Refund moved to processing and submitted to SimPay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'

  /refunds/{id}/cancel-reservation:
    post:
      tags: [refunds]
      summary: Cancel refund hold reservation
      operationId: cancel_refund_reservation
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Refund hold cancelled and released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'

  /refunds/{id}:
    get:
      tags: [refunds]
      summary: Get refund details and gateway reference
      operationId: get_refund
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Refund transaction record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /orders/{id}/refunds:
    get:
      tags: [refunds]
      summary: List all refunds for an order
      operationId: list_order_refunds
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of refunds for the order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundListResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /customers/{id}/refund-summary:
    get:
      tags: [refunds]
      summary: Get customer refund summary and 30-day cumulative totals
      operationId: get_customer_refund_summary
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Cumulative refund history summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRefundSummaryResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  # =========================================================================
  # ADMIN
  # =========================================================================
  /admin/orders:
    get:
      tags: [admin]
      summary: Admin list all orders across store
      operationId: admin_list_orders
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of orders for seller admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'

  /admin/orders/{id}:
    get:
      tags: [admin]
      summary: Admin get order details
      operationId: admin_get_order
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  /admin/customers/{id}:
    get:
      tags: [admin]
      summary: Admin get customer profile and risk facts
      operationId: admin_get_customer
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer risk profile facts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCustomerDetailResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  /admin/returns/{id}/receive:
    post:
      tags: [admin]
      summary: Record received return package at warehouse
      operationId: admin_receive_return
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Return marked received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
