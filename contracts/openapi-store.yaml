# =========================================================================
# COMPONENTS
# =========================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        RS256 JWT issued by NestKart Store. Claims: sub (user_id), role
        (customer, seller_owner, seller_staff, service), customer_id,
        aud: [nestkart-api, sellershield-agent], iss: nestkart, exp, auth_time.

  parameters:
    X-Request-ID:
      name: X-Request-ID
      in: header
      required: false
      description: Unique end-to-end request tracing identifier
      schema:
        type: string
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique client key for mutation idempotency
      schema:
        type: string
    If-Match:
      name: If-Match
      in: header
      required: true
      description: Entity version tag for optimistic concurrency control
      schema:
        type: integer
    X-Store-Signature:
      name: X-Store-Signature
      in: header
      required: true
      description: HMAC-SHA256 signature of timestamp.body using WEBHOOK_SECRET
      schema:
        type: string
    X-Store-Timestamp:
      name: X-Store-Timestamp
      in: header
      required: true
      description: UTC unix timestamp in seconds when webhook was dispatched
      schema:
        type: integer
    X-Event-Id:
      name: X-Event-Id
      in: header
      required: true
      description: Unique UUID for the outbox event to protect against duplicates
      schema:
        type: string

  responses:
    Error400:
      description: Validation error or invalid payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Authentication required or invalid/expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Forbidden - insufficient role or authorization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Resource not found (uniform 404 for nonexistent or unowned items)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            uniformNotFound:
              summary: Uniform 404 order lookup error
              value:
                error:
                  code: "not_found"
                  message: "Order ORD-9999 was not found"
                  request_id: "req-abc-123"
                  details: {}
    Error409:
      description: State conflict, duplicate request, or autonomy limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: Unprocessable entity or semantic validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # -----------------------------------------------------------------------
    # Shared Error Model
    # -----------------------------------------------------------------------
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true

    ErrorCode:
      type: string
      enum:
        - not_found
        - forbidden
        - invalid_state
        - limit_exceeded
        - duplicate
        - validation_error
        - upstream_unavailable
        - idempotency_mismatch

    # -----------------------------------------------------------------------
    # State Enums
    # -----------------------------------------------------------------------
    OrderStatus:
      type: string
      enum:
        - placed
        - packed
        - shipped
        - out_for_delivery
        - delivered
        - cancelled

    PaymentMethod:
      type: string
      enum:
        - prepaid
        - cod

    PaymentStatus:
      type: string
      enum:
        - paid
        - pending
        - cod_pending
        - cod_collected
        - refunded
        - partially_refunded

    ShipmentStatus:
      type: string
      enum:
        - label_created
        - picked_up
        - in_transit
        - out_for_delivery
        - delivered
        - exception
        - lost
        - rto

    ReturnStatus:
      type: string
      enum:
        - requested
        - approved
        - rejected
        - cancelled
        - pickup_scheduled
        - in_transit_back
        - received
        - inspected_ok
        - inspection_failed
        - completed

    ReturnReasonCode:
      type: string
      enum:
        - defective
        - damaged
        - wrong_item
        - not_as_described
        - changed_mind
        - arrived_late

    ReturnResolution:
      type: string
      enum:
        - refund
        - store_credit

    RefundStatus:
      type: string
      enum:
        - reserved
        - authorized
        - processing
        - completed
        - failed
        - released

    RefundMethod:
      type: string
      enum:
        - original
        - store_credit
        - upi_payout

    # -----------------------------------------------------------------------
    # Auth Models
    # -----------------------------------------------------------------------
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string

    RegisterResponse:
      type: object
      additionalProperties: false
      required: [user_id, customer_id, email, status]
      properties:
        user_id:
          type: string
        customer_id:
          type: string
        email:
          type: string
        status:
          type: string

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/CurrentUserResponse'

    RefreshTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer

    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user_id, email, role, display_name]
      properties:
        user_id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [customer, seller_owner, seller_staff, service]
        customer_id:
          type: string
          nullable: true
        display_name:
          type: string

    ServiceTokenRequest:
      type: object
      additionalProperties: false
      required: [client_id, client_secret]
      properties:
        client_id:
          type: string
        client_secret:
          type: string

    ServiceTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, scopes]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        scopes:
          type: array
          items:
            type: string

    JWKSResponse:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JWKKey'

    JWKKey:
      type: object
      additionalProperties: false
      required: [kty, alg, use, kid, n, e]
      properties:
        kty:
          type: string
        alg:
          type: string
        use:
          type: string
        kid:
          type: string
        n:
          type: string
        e:
          type: string

    PublicClockResponse:
      type: object
      additionalProperties: false
      required: [now_utc, mode]
      properties:
        now_utc:
          type: string
          format: date-time
        mode:
          type: string
          enum: [realtime, simulated, frozen]
        offset_seconds:
          type: integer

    # -----------------------------------------------------------------------
    # Order & Shipment Models
    # -----------------------------------------------------------------------
    Address:
      type: object
      additionalProperties: false
      required: [full_name, line1, city, state, postal_code, country]
      properties:
        full_name:
          type: string
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
        phone:
          type: string

    OrderItem:
      type: object
      additionalProperties: false
      required: [item_id, sku, name, qty, unit_price_paise, discount_alloc_paise, line_paid_paise]
      properties:
        item_id:
          type: string
        sku:
          type: string
        name:
          type: string
        category:
          type: string
        qty:
          type: integer
          minimum: 1
        unit_price_paise:
          type: integer
          minimum: 0
        discount_alloc_paise:
          type: integer
          minimum: 0
        line_paid_paise:
          type: integer
          minimum: 0
        flags:
          type: object
          additionalProperties: true

    Order:
      type: object
      additionalProperties: false
      required:
        - order_id
        - customer_id
        - status
        - payment_method
        - payment_status
        - subtotal_paise
        - discount_paise
        - shipping_fee_paise
        - total_paise
        - items
        - placed_at
        - version
      properties:
        order_id:
          type: string
        customer_id:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'
        subtotal_paise:
          type: integer
          minimum: 0
        discount_paise:
          type: integer
          minimum: 0
        shipping_fee_paise:
          type: integer
          minimum: 0
        total_paise:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        ship_to:
          $ref: '#/components/schemas/Address'
        placed_at:
          type: string
          format: date-time
        shipped_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer

    OrderListResponse:
      type: object
      additionalProperties: false
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          nullable: true

    ShipmentEvent:
      type: object
      additionalProperties: false
      required: [event_id, occurred_at, status, location]
      properties:
        event_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        location:
          type: string
        note:
          type: string

    Shipment:
      type: object
      additionalProperties: false
      required: [shipment_id, order_id, carrier, tracking_no, status, events]
      properties:
        shipment_id:
          type: string
        order_id:
          type: string
        carrier:
          type: string
        tracking_no:
          type: string
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        eta_at:
          type: string
          format: date-time
          nullable: true
        delayed:
          type: boolean
        events:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentEvent'

    OrderShipmentResponse:
      type: object
      additionalProperties: false
      required: [order_id, shipment]
      properties:
        order_id:
          type: string
        shipment:
          $ref: '#/components/schemas/Shipment'

    EvidenceItem:
      type: object
      additionalProperties: false
      required: [evidence_id, order_id, content_type, size_bytes, created_at]
      properties:
        evidence_id:
          type: string
        order_id:
          type: string
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size_bytes:
          type: integer
          maximum: 2097152
        created_at:
          type: string
          format: date-time
        note:
          type: string

    EvidenceListResponse:
      type: object
      additionalProperties: false
      required: [evidence]
      properties:
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceItem'

    RefundableItemStatus:
      type: object
      additionalProperties: false
      required: [item_id, original_qty, remaining_qty, line_paid_paise, refundable_paise]
      properties:
        item_id:
          type: string
        original_qty:
          type: integer
        remaining_qty:
          type: integer
        line_paid_paise:
          type: integer
          minimum: 0
        refundable_paise:
          type: integer
          minimum: 0

    RefundableCheckResponse:
      type: object
      additionalProperties: false
      required: [order_id, max_refundable_paise, items]
      properties:
        order_id:
          type: string
        max_refundable_paise:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/RefundableItemStatus'

    # -----------------------------------------------------------------------
    # Return Models
    # -----------------------------------------------------------------------
    ReturnItemRequest:
      type: object
      additionalProperties: false
      required: [item_id, qty]
      properties:
        item_id:
          type: string
        qty:
          type: integer
          minimum: 1
        condition_note:
          type: string

    CreateReturnRequest:
      type: object
      additionalProperties: false
      required: [items, reason_code, resolution]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReturnItemRequest'
        reason_code:
          $ref: '#/components/schemas/ReturnReasonCode'
        reason_text:
          type: string
        resolution:
          $ref: '#/components/schemas/ReturnResolution'

    TransitionReturnRequest:
      type: object
      additionalProperties: false
      required: [to, reason]
      properties:
        to:
          $ref: '#/components/schemas/ReturnStatus'
        reason:
          type: string

    CancelReturnRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string

    ReturnItem:
      type: object
      additionalProperties: false
      required: [item_id, qty]
      properties:
        item_id:
          type: string
        qty:
          type: integer
          minimum: 1
        condition_note:
          type: string

    Return:
      type: object
      additionalProperties: false
      required:
        - return_id
        - order_id
        - customer_id
        - status
        - reason_code
        - resolution
        - items
        - created_at
        - version
      properties:
        return_id:
          type: string
        order_id:
          type: string
        customer_id:
          type: string
        status:
          $ref: '#/components/schemas/ReturnStatus'
        reason_code:
          $ref: '#/components/schemas/ReturnReasonCode'
        reason_text:
          type: string
        resolution:
          $ref: '#/components/schemas/ReturnResolution'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReturnItem'
        approved_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer

    ReturnListResponse:
      type: object
      additionalProperties: false
      required: [returns]
      properties:
        returns:
          type: array
          items:
            $ref: '#/components/schemas/Return'
        next_cursor:
          type: string
          nullable: true

    # -----------------------------------------------------------------------
    # Refund Models
    # -----------------------------------------------------------------------
    CreateRefundReservationRequest:
      type: object
      additionalProperties: false
      required: [amount_paise, method]
      properties:
        amount_paise:
          type: integer
          minimum: 1
        return_id:
          type: string
        method:
          $ref: '#/components/schemas/RefundMethod'

    AuthorizeRefundRequest:
      type: object
      additionalProperties: false
      required: [amount_paise]
      properties:
        amount_paise:
          type: integer
          minimum: 1
        note:
          type: string

    Refund:
      type: object
      additionalProperties: false
      required:
        - refund_id
        - order_id
        - customer_id
        - amount_paise
        - method
        - status
        - created_at
      properties:
        refund_id:
          type: string
        order_id:
          type: string
        return_id:
          type: string
          nullable: true
        customer_id:
          type: string
        amount_paise:
          type: integer
          minimum: 0
        method:
          $ref: '#/components/schemas/RefundMethod'
        status:
          $ref: '#/components/schemas/RefundStatus'
        gateway_ref:
          type: string
          nullable: true
        authorized_by:
          type: string
          nullable: true
        authorized_amount_paise:
          type: integer
          nullable: true
          minimum: 0
        authorized_at:
          type: string
          format: date-time
          nullable: true
        failure_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RefundListResponse:
      type: object
      additionalProperties: false
      required: [refunds]
      properties:
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/Refund'

    CustomerRefundSummaryResponse:
      type: object
      additionalProperties: false
      required: [customer_id, days, total_refunded_paise, refund_count, return_count]
      properties:
        customer_id:
          type: string
        days:
          type: integer
        total_refunded_paise:
          type: integer
          minimum: 0
        refund_count:
          type: integer
        return_count:
          type: integer

    # -----------------------------------------------------------------------
    # Admin & Store Settings Models
    # -----------------------------------------------------------------------
    AdminCustomerDetailResponse:
      type: object
      additionalProperties: false
      required: [customer_id, full_name, email, joined_at, returns_30d, refund_ratio_90d, account_age_days]
      properties:
        customer_id:
          type: string
        full_name:
          type: string
        email:
          type: string
        joined_at:
          type: string
          format: date-time
        returns_30d:
          type: integer
        refund_ratio_90d:
          type: number
        account_age_days:
          type: integer

    StoreSettings:
      type: object
      additionalProperties: false
      required: [autonomy_cap_paise, autonomy_daily_cap_paise, version]
      properties:
        autonomy_cap_paise:
          type: integer
          minimum: 0
          example: 50000
        autonomy_daily_cap_paise:
          type: integer
          minimum: 0
          example: 500000
        updated_by:
          type: string
        updated_at:
          type: string
          format: date-time
        version:
          type: integer

    UpdateAdminSettingsRequest:
      type: object
      additionalProperties: false
      required: [autonomy_cap_paise, autonomy_daily_cap_paise]
      properties:
        autonomy_cap_paise:
          type: integer
          minimum: 0
        autonomy_daily_cap_paise:
          type: integer
          minimum: 0

    # -----------------------------------------------------------------------
    # Mail Models
    # -----------------------------------------------------------------------
    MailMessage:
      type: object
      additionalProperties: false
      required: [message_id, thread_id, direction, from_addr, to_addr, subject, body_text, verified_sender, created_at]
      properties:
        message_id:
          type: string
        thread_id:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        channel:
          type: string
          enum: [email, whatsapp_sim]
        from_addr:
          type: string
        to_addr:
          type: string
        subject:
          type: string
        body_text:
          type: string
        verified_sender:
          type: boolean
        created_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
          nullable: true

    MailMessageListResponse:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MailMessage'

    MailThreadResponse:
      type: object
      additionalProperties: false
      required: [thread_id, messages]
      properties:
        thread_id:
          type: string
        subject:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MailMessage'

    SendMailRequest:
      type: object
      additionalProperties: false
      required: [to_addr, subject, body_text]
      properties:
        thread_id:
          type: string
        to_addr:
          type: string
        subject:
          type: string
        body_text:
          type: string
        channel:
          type: string
          enum: [email, whatsapp_sim]
          default: email

    # -----------------------------------------------------------------------
    # Carrier & Demo Simulation Models
    # -----------------------------------------------------------------------
    SimCarrierAdvanceRequest:
      type: object
      additionalProperties: false
      required: [status, location]
      properties:
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        location:
          type: string
        note:
          type: string

    SimCarrierScenarioPlayRequest:
      type: object
      additionalProperties: false
      properties:
        speed_multiplier:
          type: number
          default: 1.0

    DemoClockRequest:
      type: object
      additionalProperties: false
      properties:
        advance_seconds:
          type: integer
        freeze_at:
          type: string
          format: date-time
        mode:
          type: string
          enum: [realtime, simulated, frozen]

    DemoFaultsRequest:
      type: object
      additionalProperties: false
      required: [fault_name, enabled]
      properties:
        fault_name:
          type: string
        enabled:
          type: boolean
        params:
          type: object
          additionalProperties: true

    DemoStateResponse:
      type: object
      additionalProperties: false
      required: [clock, seeded_orders_count, active_returns_count, active_faults]
      properties:
        clock:
          $ref: '#/components/schemas/PublicClockResponse'
        seeded_orders_count:
          type: integer
        active_returns_count:
          type: integer
        active_faults:
          type: array
          items:
            type: string

    DemoScenarioLoadRequest:
      type: object
      additionalProperties: false
      properties:
        reset_first:
          type: boolean
          default: true

    # -----------------------------------------------------------------------
    # Webhook Outbox Payload Models
    # -----------------------------------------------------------------------
    WebhookEnvelope:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, resource_version, data]
      properties:
        event_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - order.created
            - order.updated
            - shipment.updated
            - shipment.delayed
            - return.updated
            - refund.updated
            - mail.inbound
        occurred_at:
          type: string
          format: date-time
        resource_version:
          type: integer
        data:
          type: object
          additionalProperties: true

