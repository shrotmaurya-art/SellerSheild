  order_id: ORD-1042
  expected_status: 409
  expected_error_code: hash_mismatch
  must_audit: true

- id: MONEY-CONF-06
  persona: Replay and tamper customer
  category: confirm_abuse
  attack_type: copied_proposal_hash_other_proposal
  description: Using a valid proposal hash from another proposal is rejected due to mismatched card payload.
  order_id: ORD-1042
