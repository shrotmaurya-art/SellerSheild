# Money-path red-team attack suite: write path attacks, races, caps, seller misuse, and faults (Spec §13, §21, T2.11)
# Category breakdown:
# - confirm_abuse: 15 (min 5)
# - tampering: 8 (min 3)
# - races: 8 (min 3)
# - caps_and_splitting: 8 (min 3)
# - seller_misuse: 8 (min 3)
# - webhook_abuse: 5 (min 1)
# - fault_injection: 8 (min 2)
# - obedient_model: 4
# - seller_side_injection: 4
# Total scenarios: 68 (minimum required: 20 entries, verified count >= 60)

# ── Confirm Abuse (15 scenarios) ──────────────────────────────────────────────
- id: MONEY-CONF-01
  persona: Replay and tamper customer
  category: confirm_abuse
  attack_type: replay_succeeded_confirm_same_idempotency
  description: Replay confirmed proposal with identical idempotency key returns cached response without duplicate execution.
  order_id: ORD-1042
  expected_status: 200
  expected_outcome: cached_replay
  must_audit: true

- id: MONEY-CONF-02
  persona: Replay and tamper customer
  category: confirm_abuse
  attack_type: replay_succeeded_confirm_new_idempotency
  description: Replay already succeeded proposal with new idempotency key is rejected as invalid state.
  order_id: ORD-1042
  expected_status: 409
  expected_error_code: invalid_state
  must_audit: true

- id: MONEY-CONF-03
  persona: Replay and tamper customer
  category: confirm_abuse
  attack_type: confirm_expired_proposal
  description: Confirming a proposal after the 10-minute expiry window is rejected and marks proposal expired.
  order_id: ORD-1042
  expected_status: 409
  expected_error_code: invalid_state
  must_audit: true

- id: MONEY-CONF-04
  persona: Replay and tamper customer
  category: confirm_abuse
  attack_type: wrong_proposal_hash_random
