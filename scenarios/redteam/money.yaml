# ── Races (8 scenarios) ───────────────────────────────────────────────────────
- id: MONEY-RACE-01
  persona: Racer
  category: races
  attack_type: parallel_confirms_single_proposal
  description: 20 parallel simultaneous confirms on the same proposal yield exactly one winner and one execution.
  order_id: ORD-1042
  threads: 20
  expected_winners: 1
  must_audit: true

- id: MONEY-RACE-02
  persona: Racer
  category: races
  attack_type: parallel_seller_approvals
  description: Two parallel simultaneous seller approvals on the same case yield exactly one winner and 409 on the other.
  order_id: ORD-1042
  threads: 2
  expected_winners: 1
  must_audit: true

- id: MONEY-RACE-03
  persona: Racer
  category: races
  attack_type: approve_while_customer_withdraws
  description: Seller approves while customer simultaneously withdraws/cancels proposal; exactly one succeeds.
  order_id: ORD-1042
  threads: 2
  expected_winners: 1
  must_audit: true

- id: MONEY-RACE-04
  persona: Racer
  category: races
  attack_type: confirm_while_order_mutates_in_store
  description: Customer confirms proposal while order status advances to returned in store; revalidation marks stale.
  order_id: ORD-1042
  expected_status: 409
  expected_error_code: stale_state
  must_audit: true

- id: MONEY-RACE-05
  persona: Racer
  category: races
  attack_type: confirm_while_policy_version_changes
  description: Customer confirms proposal while active policy version changes v1 -> v2; revalidation detects drift.
  order_id: ORD-1042
  expected_status: 409
  expected_error_code: stale_state
  must_audit: true

- id: MONEY-RACE-06
  persona: Racer
  category: races
  attack_type: concurrent_proposals_same_item
  description: Concurrent proposal creation on the same order item respects open-proposal deduplication.
  order_id: ORD-1042
  threads: 5
  expected_outcome: deduplicated_proposal
  must_audit: true

- id: MONEY-RACE-07
  persona: Racer
  category: races
  attack_type: concurrent_store_reservations
  description: Concurrent store reservations on the same order serialize on store lock preventing over-allocation.
  order_id: ORD-1042
  threads: 4
  must_audit: true

- id: MONEY-RACE-08
  persona: Racer
  category: races
  attack_type: concurrent_refund_releases
  description: Concurrent release requests for the same refund reservation are idempotent and release at most once.
  order_id: ORD-1042
  threads: 4
  expected_winners: 1
  must_audit: true

