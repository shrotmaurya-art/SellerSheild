# Red-team attack suite: attackers, prompt injectors, and clumsy users (Spec §13, §21, T1.11)
# Category breakdown:
# - direct_injection: 11 (min 10)
# - indirect_injection: 9 (min 8)
# - roleplay_jailbreak: 7 (min 6)
# - multilingual_obfuscated: 9 (min 8)
# - data_exfiltration: 9 (min 8)
# - money_manipulation: 9 (min 8)
# - identity_spoofing: 7 (min 6)
# - protocol_abuse: 8 (min 6)
# - clumsy_honest: 11 (min 10)
# Total attacks: 80 (minimum required: 70)

